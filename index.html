<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Little Universe 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #fff5f8;
      --bg2: #ffeef5;
      --bg3: #fce7f3;
      --pink: #f472b6;
      --pink-deep: #ec4899;
      --rose: #fb7185;
      --lavender: #c084fc;
      --soft-purple: #e9d5ff;
      --peach: #fda4af;
      --text: #4a3040;
      --text-soft: #9a7a88;
      --white: #ffffff;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(244, 114, 182, 0.3);
      --shadow: 0 16px 48px rgba(236, 72, 153, 0.14);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(165deg, #fff5f8 0%, #ffeef5 35%, #fce7f3 70%, #f3e8ff 100%);
      font-family: 'Quicksand', system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    #canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #parallax { position: fixed; inset: -30px; z-index: 1; pointer-events: none; transition: transform 0.1s ease-out; }

    .screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; visibility: hidden;
      transition: opacity 0.9s ease, visibility 0.9s, transform 0.9s ease;
      pointer-events: none;
      padding: 1.2rem;
    }
    .screen.active { opacity: 1; visibility: visible; pointer-events: auto; }

    /* ===== OPENING ===== */
    #opening { text-align: center; }
    .bow {
      font-size: 3.2rem;
      margin-bottom: 0.8rem;
      animation: floaty 3.8s ease-in-out infinite;
      filter: drop-shadow(0 6px 12px rgba(244,114,182,0.3));
    }
    .quote {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.55rem, 4.8vw, 2.5rem);
      font-weight: 600;
      line-height: 1.4;
      max-width: 640px;
      color: var(--pink-deep);
      margin-bottom: 0.5rem;
      animation: fadeUp 1.3s ease 0.2s both;
    }
    .sub {
      font-size: 0.98rem;
      color: var(--text-soft);
      margin-bottom: 2.1rem;
      animation: fadeUp 1.3s ease 0.5s both;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.9rem 1.9rem;
      font-family: 'Quicksand', sans-serif;
      font-size: 1.05rem; font-weight: 600;
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--rose));
      border: none; border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(236,72,153,0.35),
                  0 0 0 4px rgba(251,113,133,0.2);
      transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
      animation: fadeUp 1.3s ease 0.75s both;
    }
    .btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 12px 36px rgba(236,72,153,0.45),
                  0 0 0 6px rgba(251,113,133,0.25);
    }
    .btn:active { transform: scale(0.97); }

    /* ===== CONSTELLATION ===== */
    .title {
      position: absolute; top: 1.2rem; left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.25rem, 3.8vw, 1.7rem);
      font-weight: 600;
      color: var(--pink-deep);
      text-align: center; width: 92%;
    }
    .progress {
      position: absolute; top: 3.5rem; left: 50%;
      transform: translateX(-50%);
      width: min(260px, 68vw);
      height: 5px;
      background: rgba(244,114,182,0.2);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--pink), var(--lavender));
      border-radius: 99px;
      transition: width 0.5s ease;
    }
    .stars-box {
      position: relative; width: 100%; height: 100%;
      max-width: 900px; max-height: 660px;
    }
    .star {
      position: absolute;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0%, #fda4af 40%, #f472b6 70%);
      box-shadow: 0 0 16px rgba(244,114,182,0.5), 0 4px 14px rgba(236,72,153,0.25);
      border: 2.5px solid white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.35rem;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      animation: pulse 2.6s ease-in-out infinite;
      z-index: 5;
    }
    .star:hover, .star:focus {
      transform: scale(1.25);
      box-shadow: 0 0 26px rgba(244,114,182,0.7), 0 6px 18px rgba(236,72,153,0.35);
      z-index: 20;
    }
    .star.done {
      background: radial-gradient(circle at 35% 30%, #fff 0%, #e9d5ff 40%, #c084fc 75%);
      box-shadow: 0 0 16px rgba(192,132,252,0.5);
    }
    .star .tip {
      position: absolute; top: 108%; left: 50%;
      transform: translateX(-50%);
      font-size: 0.68rem; font-weight: 600;
      white-space: nowrap;
      opacity: 0; transition: opacity 0.25s;
      background: white;
      color: var(--pink-deep);
      padding: 3px 9px; border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }
    .star:hover .tip { opacity: 1; }

    /* ===== MODAL ===== */
    .overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(255, 235, 245, 0.78);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
      padding: 1rem;
    }
    .overlay.open { opacity: 1; visibility: visible; }

    .card {
      position: relative;
      width: 100%; max-width: 440px;
      max-height: 88vh; overflow-y: auto;
      background: var(--glass);
      border: 1.5px solid var(--glass-border);
      border-radius: 26px;
      padding: 1.85rem 1.6rem 1.5rem;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.8);
      transform: scale(0.9) translateY(20px);
      transition: transform 0.48s cubic-bezier(0.34,1.56,0.64,1);
      backdrop-filter: blur(16px);
    }
    .overlay.open .card { transform: scale(1) translateY(0); }

    .card h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; font-weight: 600;
      color: var(--pink-deep);
      margin-bottom: 0.85rem;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .card p, .card li {
      font-size: 0.96rem; line-height: 1.65; color: var(--text);
    }
    .card ul { list-style: none; margin: 0.75rem 0; }
    .card li {
      padding: 0.38rem 0 0.38rem 1.4rem;
      position: relative;
    }
    .card li::before {
      content: '♡';
      position: absolute; left: 0;
      color: var(--pink); font-size: 0.8rem;
    }
    .x {
      position: absolute; top: 0.85rem; right: 0.85rem;
      width: 34px; height: 34px;
      border: none; background: rgba(244,114,182,0.12);
      color: var(--pink-deep); border-radius: 50%;
      font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.25s;
    }
    .x:hover { background: rgba(244,114,182,0.25); }

    .photo {
      width: 100%; max-height: 210px;
      border-radius: 16px; overflow: hidden;
      margin: 0.85rem 0;
      border: 3px solid white;
      box-shadow: 0 6px 18px rgba(244,114,182,0.18);
      background: #ffe4ec;
      display: flex; align-items: center; justify-content: center;
      min-height: 130px;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-ph {
      text-align: center; padding: 1.4rem;
      color: var(--text-soft); font-size: 0.88rem;
    }
    .photo-ph span { font-size: 1.9rem; display: block; margin-bottom: 0.35rem; }

    .mini-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      margin-top: 0.85rem;
      padding: 0.6rem 1.25rem;
      background: linear-gradient(135deg, var(--pink), var(--lavender));
      border: none; border-radius: 999px;
      color: white; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: all 0.3s;
      box-shadow: 0 4px 14px rgba(244,114,182,0.3);
    }
    .mini-btn:hover { transform: scale(1.04); box-shadow: 0 6px 18px rgba(244,114,182,0.4); }

    /* ===== FINAL ===== */
    #final { text-align: center; }
    .planet-box {
      position: relative;
      width: 155px; height: 155px;
      margin: 0 auto;
      cursor: pointer;
    }
    .planet {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%,
        #fff 0%, #fecdd3 22%, #fda4af 48%, #f472b6 72%, #e11d48 100%);
      box-shadow:
        0 0 36px rgba(244,114,182,0.45),
        0 0 70px rgba(192,132,252,0.2),
        inset -16px -16px 32px rgba(0,0,0,0.06);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      animation: floaty 5s ease-in-out infinite;
      position: relative; z-index: 2;
    }
    .planet:hover { transform: scale(1.1); }
    .planet::after {
      content: '';
      position: absolute; inset: -12px;
      border-radius: 50%;
      border: 2px dashed rgba(244,114,182,0.35);
      animation: spin 20s linear infinite;
    }
    .planet-emoji {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.4rem; z-index: 3; pointer-events: none;
    }
    .planet-label {
      margin-top: 1.5rem;
      font-size: 1.02rem; font-weight: 600;
      color: var(--pink-deep);
    }

    .letter { text-align: left; line-height: 1.7; }
    .letter .hi {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem; font-weight: 600;
      color: var(--pink-deep); margin-bottom: 0.85rem;
    }
    .letter .body { font-size: 0.98rem; margin-bottom: 0.85rem; }
    .letter .bye {
      margin-top: 1.2rem; font-style: italic; color: var(--text-soft);
    }

    /* Voice note box */
    .voice-box {
      margin-top: 1.3rem;
      padding: 1.1rem 1rem;
      background: linear-gradient(135deg, rgba(244,114,182,0.12), rgba(192,132,252,0.12));
      border-radius: 18px;
      border: 1.5px solid rgba(244,114,182,0.25);
      text-align: center;
    }
    .voice-box h3 {
      font-size: 0.95rem; font-weight: 600;
      color: var(--pink-deep); margin-bottom: 0.75rem;
    }
    .play-voice {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1.6rem;
      background: linear-gradient(135deg, var(--pink-deep), var(--lavender));
      border: none; border-radius: 999px;
      color: white; font-size: 1rem; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(236,72,153,0.35);
      transition: all 0.3s;
    }
    .play-voice:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 26px rgba(236,72,153,0.45);
    }
    .play-voice.playing {
      background: linear-gradient(135deg, #a855f7, #c084fc);
    }
    .voice-hint {
      font-size: 0.78rem; color: var(--text-soft);
      margin-top: 0.6rem;
    }

    /* ===== ENDING ===== */
    #ending { text-align: center; }
    .end-emoji {
      font-size: 2.8rem; margin-bottom: 0.9rem;
      animation: floaty 3.5s ease-in-out infinite;
    }
    .end-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.35rem, 4.2vw, 2.1rem);
      font-weight: 600;
      color: var(--pink-deep);
      animation: fadeUp 1.2s ease both;
    }
    .end-sub {
      margin-top: 0.7rem;
      font-size: 0.95rem; color: var(--text-soft);
      animation: fadeUp 1.2s ease 0.25s both;
    }

    /* Controls */
    .controls {
      position: fixed; bottom: 1.1rem; right: 1.1rem;
      z-index: 50; display: flex; gap: 0.45rem;
    }
    .ctrl {
      width: 42px; height: 42px; border-radius: 50%;
      border: 1.5px solid rgba(244,114,182,0.3);
      background: rgba(255,255,255,0.8);
      color: var(--pink-deep); font-size: 1.1rem;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(244,114,182,0.12);
    }
    .ctrl:hover {
      background: white; border-color: var(--pink);
      transform: scale(1.08);
    }

    .toast {
      position: fixed; bottom: 5rem; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(255,255,255,0.95);
      border: 1.5px solid rgba(244,114,182,0.35);
      padding: 0.75rem 1.35rem; border-radius: 999px;
      font-size: 0.9rem; font-weight: 600;
      color: var(--pink-deep); z-index: 60;
      opacity: 0; pointer-events: none;
      transition: all 0.4s ease;
      box-shadow: 0 8px 24px rgba(236,72,153,0.15);
      white-space: nowrap; max-width: 90vw; text-align: center;
    }
    .toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    .hint {
      position: absolute; bottom: 1.7rem; left: 50%;
      transform: translateX(-50%);
      font-size: 0.76rem; color: var(--text-soft);
    }

    .float-item {
      position: absolute; font-size: 1.4rem;
      opacity: 0.5; pointer-events: none;
      animation: floatSticker 6.5s ease-in-out infinite;
      z-index: 2;
    }

    #goBtn {
      position: absolute; bottom: 4.6rem; left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      font-size: 0.92rem; padding: 0.7rem 1.45rem;
    }

    .heart-pop {
      position: fixed; pointer-events: none; z-index: 40;
      font-size: 1.15rem;
      animation: pop 1.7s ease-out forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 16px rgba(244,114,182,0.5); }
      50% { box-shadow: 0 0 26px rgba(244,114,182,0.7), 0 0 36px rgba(192,132,252,0.25); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatSticker {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-12px) rotate(4deg); }
    }
    @keyframes pop {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      100% { transform: scale(1.5) rotate(15deg); opacity: 0; }
    }

    @media (max-width: 600px) {
      .star { width: 46px; height: 46px; font-size: 1.2rem; }
      .card { padding: 1.5rem 1.25rem; border-radius: 22px; }
      .planet-box { width: 130px; height: 130px; }
      .planet-emoji { font-size: 2.9rem; }
      .title { top: 1rem; font-size: 1.15rem; }
      .progress { top: 3.15rem; }
      .bow { font-size: 2.7rem; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="parallax"></div>

  <!-- OPENING -->
  <section id="opening" class="screen active">
    <div class="bow">🎀</div>
    <p class="quote">Among a million little lights,<br>I found a friend like you</p>
    <p class="sub">A soft little universe made just for us 💕</p>
    <button class="btn" id="startBtn">🌸 Begin the Journey</button>
  </section>

  <!-- CONSTELLATION -->
  <section id="constellation" class="screen">
    <h1 class="title">Our Memory Galaxy</h1>
    <div class="progress"><div class="progress-fill" id="bar"></div></div>
    <div class="stars-box" id="starsBox"></div>
    <p class="hint">Tap a star ✨ · Catch the floating hearts</p>
  </section>

  <!-- FINAL -->
  <section id="final" class="screen">
    <div class="planet-box" id="planet" role="button" tabindex="0" aria-label="Open letter">
      <div class="planet"></div>
      <div class="planet-emoji">💌</div>
    </div>
    <p class="planet-label">A letter & a voice note for you…</p>
  </section>

  <!-- ENDING -->
  <section id="ending" class="screen">
    <div class="end-emoji">💖</div>
    <p class="end-text">Some friendships are pure magic</p>
    <p class="end-sub">Written in soft pink stars ✨</p>
  </section>

  <!-- MODAL -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="card" id="card">
      <button class="x" id="closeBtn" aria-label="Close">×</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="controls">
    <button class="ctrl" id="muteBtn" title="Music" aria-label="Toggle music">🔊</button>
  </div>

  <!-- Background soft music (optional) -->
  <audio id="bgMusic" loop preload="none"></audio>

  <!-- YOUR VOICE NOTE — change the src if your file has a different name -->
  <audio id="voiceNote" preload="auto" src="voice-note.mp3"></audio>

  <script>
    // =====================================================
    //  PERSONALIZE ✏️
    // =====================================================
    const FRIEND_NAME = "Friend";       // Friend ka naam
    const YOUR_NAME   = "Your Friend";  // Apna naam

    // Photos (optional) — same folder ya URL
    const PHOTOS = {
  funny: "funny.jpg",
  best: "best.jpg",
  adventure: "adventure.jpg"
};

    // Voice note file name (same folder mein rakho)
    // Agar naam alag hai to yahan change karo
    const VOICE_FILE = "voice-note.mp3";

    // End pe letter open hote hi voice auto-play ho? true / false
    const AUTO_PLAY_VOICE = true;
    // =====================================================

    const MEMORIES = [
      {
        id: "hello",
        emoji: "👋",
        label: "First Hello",
        content: () => `
          <h2>👋 First Hello</h2>
          <p>"Yahin se sab shuru hua…"</p>
          <p style="margin-top:0.85rem;">
            That first message, that first soft smile through the screen —
            the universe quietly decided we should be friends.
          </p>
          <p style="margin-top:0.75rem; color:var(--pink-deep); font-weight:600;">
            And I’m so glad it did. 💕
          </p>
        `
      },
      {
        id: "funny",
        emoji: "😂",
        label: "Funniest",
        content: () => `
          <h2>😂 Funniest Memory</h2>
          <div class="photo">
            ${PHOTOS.funny
              ? `<img src="${PHOTOS.funny}" alt="Funny" onerror="this.parentElement.innerHTML='<div class=\\'photo-ph\\'><span>📷</span>Photo missing</div>'">`
              : `<div class="photo-ph"><span>📷</span>Funny photo yahan<br><small>PHOTOS.funny mein path daalo</small></div>`}
          </div>
          <p>Woh wala moment jab hum dono has-has ke pagal ho gaye the…</p>
          <p style="margin-top:0.65rem; font-style:italic; opacity:0.85;">
            (Apni favorite funny story yahan likh do)
          </p>
        `
      },
      {
        id: "picture",
        emoji: "📸",
        label: "Best Pic",
        content: () => `
          <h2>📸 Best Picture</h2>
          <div class="photo">
            ${PHOTOS.best
              ? `<img src="${PHOTOS.best}" alt="Best" onerror="this.parentElement.innerHTML='<div class=\\'photo-ph\\'><span>📷</span>Photo missing</div>'">`
              : `<div class="photo-ph"><span>💖</span>Favorite selfie / photo<br><small>PHOTOS.best</small></div>`}
          </div>
          <p>This one frame holds so many soft feelings.</p>
          <p style="margin-top:0.55rem;">Some pictures are pure heart. 💗</p>
        `
      },
      {
        id: "appreciate",
        emoji: "💬",
        label: "Appreciate",
        content: () => `
          <h2>💬 Things I Love About You</h2>
          <ul>
            <li>You always listen with your whole heart</li>
            <li>Your honesty — even when it’s hard</li>
            <li>How you make ordinary days feel special</li>
            <li>Your quiet strength and soft heart</li>
            <li>The way you show up, every time</li>
            <li>Your laughter that lights everything up</li>
            <li>That you somehow know when I need you</li>
            <li>Turning chaos into the coziest comfort</li>
          </ul>
          <p style="margin-top:0.55rem; color:var(--pink-deep); font-weight:600;">
            And a thousand more reasons… 🎀
          </p>
        `
      },
      {
        id: "song",
        emoji: "🎵",
        label: "Our Song",
        content: () => `
          <h2>🎵 Our Song</h2>
          <p>Every friendship has a soundtrack. This one is ours.</p>
          <button class="mini-btn" id="songBtn">▶ Play Our Song</button>
          <p style="margin-top:0.9rem; font-size:0.85rem; opacity:0.75;">
            (Button pe apna favorite song link open karwa sakte ho)
          </p>
        `
      },
      {
        id: "wish",
        emoji: "🌠",
        label: "Wish",
        content: () => `
          <h2>🌠 Wish Star</h2>
          <p>On this Friendship Day, I wish…</p>
          <p style="margin-top:0.85rem;">
            That our bond stays soft and bright.<br><br>
            That no matter how far we go, we always find our way back.<br><br>
            That laughter, trust and warm moments never leave our side.
          </p>
          <p style="margin-top:0.95rem; color:var(--pink-deep); font-weight:600;">
            Happy Friendship Day 🌸💖
          </p>
        `
      },
      {
        id: "adventure",
        emoji: "🌈",
        label: "Adventures",
        content: () => `
          <h2>🌈 Shared Adventures</h2>
          <div class="photo">
            ${PHOTOS.adventure
              ? `<img src="${PHOTOS.adventure}" alt="Adventure" onerror="this.parentElement.innerHTML='<div class=\\'photo-ph\\'><span>📷</span>Photo missing</div>'">`
              : `<div class="photo-ph"><span>🌈</span>Adventure photo<br><small>PHOTOS.adventure</small></div>`}
          </div>
          <p>From late-night talks to random plans that somehow always work…</p>
          <p style="margin-top:0.65rem;">
            Every little adventure with you becomes a memory I want to keep forever.
          </p>
        `
      },
      {
        id: "support",
        emoji: "💗",
        label: "Support",
        content: () => `
          <h2>💗 Quiet Support</h2>
          <p>You don’t always need words. Sometimes just knowing you’re there is enough.</p>
          <p style="margin-top:0.85rem;">
            In the heavy moments, your presence made everything lighter.
            That’s a kind of magic only real friends carry. 💕
          </p>
        `
      }
    ];

    const CUTE_MSGS = [
      "You're pure magic 💕",
      "Thanks for always being there 🌸",
      "Friends like you are rare 💖",
      "You make everything softer ✨",
      "Grateful for you, always 🎀",
      "Keep shining 💫",
      "You're my favorite person 💗",
      "Distance means nothing 💌"
    ];

    // ===== STATE =====
    let screen = "opening";
    let muted = true;
    let visited = new Set();
    let unlocked = false;
    let voicePlaying = false;

    // ===== CANVAS =====
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let W, H, hearts = [], sparkles = [];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      hearts = [];
      sparkles = [];
      const n = Math.min(40, Math.floor((W * H) / 20000));
      for (let i = 0; i < n; i++) {
        hearts.push({
          x: Math.random() * W, y: Math.random() * H,
          s: Math.random() * 9 + 5,
          a: Math.random() * 0.3 + 0.12,
          sp: Math.random() * 0.35 + 0.12,
          dr: (Math.random() - 0.5) * 0.25,
          r: Math.random() * Math.PI * 2
        });
      }
      for (let i = 0; i < 70; i++) {
        sparkles.push({
          x: Math.random() * W, y: Math.random() * H,
          r: Math.random() * 1.6 + 0.3,
          a: Math.random() * 0.55 + 0.2,
          t: Math.random() * Math.PI * 2,
          sp: Math.random() * 0.02 + 0.006
        });
      }
    }

    function heart(x, y, s, a, rot) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.scale(s / 16, s / 16);
      ctx.beginPath();
      ctx.moveTo(0, 4);
      ctx.bezierCurveTo(-8, -4, -14, 6, 0, 14);
      ctx.bezierCurveTo(14, 6, 8, -4, 0, 4);
      ctx.fillStyle = `rgba(244, 114, 182, ${a})`;
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      // soft blobs
      [
        { x: W * 0.18, y: H * 0.28, r: 170, c: "253,164,175" },
        { x: W * 0.78, y: H * 0.58, r: 150, c: "233,213,255" },
        { x: W * 0.5, y: H * 0.12, r: 110, c: "251,207,232" }
      ].forEach(b => {
        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        g.addColorStop(0, `rgba(${b.c}, 0.16)`);
        g.addColorStop(1, "transparent");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });
      sparkles.forEach(s => {
        s.t += s.sp;
        const a = s.a * (0.5 + 0.5 * Math.sin(s.t));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fill();
      });
      hearts.forEach(h => {
        h.y -= h.sp;
        h.x += h.dr;
        h.r += 0.008;
        if (h.y < -20) { h.y = H + 20; h.x = Math.random() * W; }
        heart(h.x, h.y, h.s, h.a, h.r);
      });
      requestAnimationFrame(draw);
    }

    // Parallax
    const par = document.getElementById("parallax");
    function onMove(e) {
      const x = (e.clientX || (e.touches && e.touches[0].clientX) || W / 2) / W;
      const y = (e.clientY || (e.touches && e.touches[0].clientY) || H / 2) / H;
      par.style.transform = `translate(${(x - 0.5) * 22}px, ${(y - 0.5) * 16}px)`;
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("touchmove", onMove, { passive: true });

    // Screens
    function show(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      screen = id;
    }

    // Start
    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("opening").style.transform = "scale(1.06)";
      setTimeout(() => {
        show("constellation");
        placeStars();
        floatItems();
      }, 650);
    });

    // Stars
    function placeStars() {
      const box = document.getElementById("starsBox");
      box.innerHTML = "";
      const pos = [
        { t: "15%", l: "18%" }, { t: "24%", l: "68%" },
        { t: "38%", l: "11%" }, { t: "44%", l: "46%" },
        { t: "50%", l: "76%" }, { t: "63%", l: "26%" },
        { t: "68%", l: "58%" }, { t: "30%", l: "36%" }
      ];
      MEMORIES.forEach((m, i) => {
        const el = document.createElement("div");
        el.className = "star";
        el.style.top = pos[i].t;
        el.style.left = pos[i].l;
        el.innerHTML = `${m.emoji}<span class="tip">${m.label}</span>`;
        el.setAttribute("role", "button");
        el.tabIndex = 0;
        el.addEventListener("click", () => openMem(m, el));
        el.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") openMem(m, el);
        });
        box.appendChild(el);
      });
    }

    function updateBar() {
      document.getElementById("bar").style.width =
        (visited.size / MEMORIES.length) * 100 + "%";
    }

    // Modal
    const overlay = document.getElementById("overlay");
    const card = document.getElementById("card");

    function openMem(m, el) {
      visited.add(m.id);
      if (el) el.classList.add("done");
      updateBar();

      card.innerHTML = `
        <button class="x" id="closeBtn" aria-label="Close">×</button>
        ${m.content()}
      `;
      document.getElementById("closeBtn").onclick = closeModal;
      overlay.classList.add("open");

      const songBtn = document.getElementById("songBtn");
      if (songBtn) {
        songBtn.onclick = () => toast("Apna song link yahan daal sakte ho 🎵");
      }

      if (visited.size >= 4 && !unlocked) {
        unlocked = true;
        setTimeout(() => {
          if (screen === "constellation" && !document.getElementById("goBtn")) {
            const b = document.createElement("button");
            b.id = "goBtn";
            b.className = "btn";
            b.innerHTML = "🌸 Continue to the Letter";
            b.onclick = () => { b.remove(); show("final"); };
            document.getElementById("constellation").appendChild(b);
          }
        }, 750);
      }
    }

    function closeModal() {
      overlay.classList.remove("open");
      // stop voice if playing when closing
      const vn = document.getElementById("voiceNote");
      if (!vn.paused) {
        vn.pause();
        vn.currentTime = 0;
        voicePlaying = false;
      }
    }
    overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });

    // Planet + Letter + Voice
    document.getElementById("planet").addEventListener("click", openLetter);
    document.getElementById("planet").addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") openLetter();
    });

    function openLetter() {
      // ensure correct src
      const vn = document.getElementById("voiceNote");
      vn.src = VOICE_FILE;

      card.innerHTML = `
        <button class="x" id="closeBtn" aria-label="Close">×</button>
        <div class="letter">
          <p class="hi">Dear ${FRIEND_NAME},</p>
          <p class="body">
            Life is full of people, but very few become the soft pink stars that brighten everything.
            Thank you for being one of those stars.
          </p>
          <p class="body">
            No matter where life takes us, I hope our friendship always shines —
            just like this little galaxy we made together.
          </p>
          <p class="body" style="color:var(--pink-deep); font-weight:600;">
            Happy Friendship Day 🌸💖
          </p>
          <p class="bye">With all the soft hearts,<br>${YOUR_NAME}</p>

          <div class="voice-box">
            <h3>🎤 A little voice note for you</h3>
            <button class="play-voice" id="playVoiceBtn">▶ Play Voice Note</button>
            <p class="voice-hint">Tap to listen 💕</p>
          </div>
        </div>
      `;
      document.getElementById("closeBtn").onclick = () => {
        closeModal();
        setTimeout(() => {
          show("ending");
          burst();
        }, 380);
      };
      overlay.classList.add("open");

      const playBtn = document.getElementById("playVoiceBtn");
      playBtn.onclick = toggleVoice;

      // Auto-play if enabled
      if (AUTO_PLAY_VOICE) {
        setTimeout(() => {
          vn.play().then(() => {
            voicePlaying = true;
            playBtn.textContent = "⏸ Pause";
            playBtn.classList.add("playing");
          }).catch(() => {
            // browser blocked autoplay — user can still click
            toast("Tap the play button to hear the note 💕");
          });
        }, 600);
      }
    }

    function toggleVoice() {
      const vn = document.getElementById("voiceNote");
      const btn = document.getElementById("playVoiceBtn");
      if (!btn) return;

      if (voicePlaying) {
        vn.pause();
        voicePlaying = false;
        btn.textContent = "▶ Play Voice Note";
        btn.classList.remove("playing");
      } else {
        vn.play().then(() => {
          voicePlaying = true;
          btn.textContent = "⏸ Pause";
          btn.classList.add("playing");
        }).catch(() => {
          toast("Couldn’t play audio — check the file name");
        });
      }
    }

    // When voice ends, reset button
    document.getElementById("voiceNote").addEventListener("ended", () => {
      voicePlaying = false;
      const btn = document.getElementById("playVoiceBtn");
      if (btn) {
        btn.textContent = "▶ Play Voice Note";
        btn.classList.remove("playing");
      }
    });

    // Ending burst
    function burst() {
      for (let i = 0; i < 26; i++) {
        setTimeout(() => {
          const el = document.createElement("div");
          el.className = "heart-pop";
          el.textContent = ["💖","💕","💗","🎀","🌸","✨"][Math.floor(Math.random() * 6)];
          el.style.left = Math.random() * 100 + "vw";
          el.style.top = Math.random() * 100 + "vh";
          el.style.fontSize = (Math.random() * 1.1 + 0.85) + "rem";
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1800);
        }, i * 55);
      }
    }

    // Floating items
    function floatItems() {
      const items = ["🎀", "🌸", "💖", "✨", "💕", "💗"];
      const box = document.getElementById("constellation");
      for (let i = 0; i < 7; i++) {
        const s = document.createElement("div");
        s.className = "float-item";
        s.textContent = items[i % items.length];
        s.style.left = (7 + Math.random() * 86) + "%";
        s.style.top = (14 + Math.random() * 68) + "%";
        s.style.animationDelay = (Math.random() * 3.5) + "s";
        s.style.fontSize = (1.05 + Math.random() * 0.8) + "rem";
        box.appendChild(s);
      }
    }

    // Toast + random hearts
    let lastT = 0;
    function toast(msg) {
      const now = Date.now();
      if (now - lastT < 2000) return;
      lastT = now;
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    document.addEventListener("click", e => {
      if (screen !== "constellation") return;
      if (e.target.closest(".star") || e.target.closest(".btn") || e.target.closest(".ctrl")) return;
      if (Math.random() > 0.55) {
        toast(CUTE_MSGS[Math.floor(Math.random() * CUTE_MSGS.length)]);
      }
    });

    // Music mute
    const bg = document.getElementById("bgMusic");
    document.getElementById("muteBtn").addEventListener("click", () => {
      muted = !muted;
      document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
      if (muted) bg.pause();
      else {
        if (!bg.src) toast("");
        else bg.play().catch(() => {});
      }
    });

    // Init
    window.addEventListener("resize", resize);
    resize();
    draw();
  </script>
</body>
</html>
